<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Login Form</title>
    <style>
        .form-start {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            font-family: 'Roboto';
        }
        .container-form {
            width: 800px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #FFF;
            box-shadow: 0 0 10px rgba(0, 0, 0, .1);
            overflow: hidden;
            position: relative;
            border: 10px solid #FFF;
            border-radius: 10px;
        }
        .bg {
            width: 50%;
            height: 100%;
            background-image: url('https://i.postimg.cc/nz6YzMPg/background.jpgs');
            background-size: cover;
            border-top-left-radius: 5px;
            border-bottom-left-radius: 5px;
            position: relative;
        }
        .bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 140, 0, .5) 100%);
        }
        form {
            min-width: 250px !important;
            width: 50%;
            height: 100%;
            padding: 30px 20px;
        }
        .heading {
            font-size: 40px;
            text-transform: capitalize;
            margin-bottom: 60px;
            text-align: center;
        }
        label {
            font-size: 16px;
            display: block;
            margin: 10px 0;
            text-transform: capitalize;
        }
        input {
            font-size: 16px;
            display: block;
            width: 90%;
            border: none;
            border-bottom: 1px solid #000;
            margin-bottom: 20px;
        }
        .login-btn {
            width: 130px;
            height: 30px;
            text-transform: capitalize;
            border-radius: 50px;
            border: none;
            background: orange;
            color: #FFF;
            display: block;
            cursor: pointer;
            margin: 50px auto;
        }
        .register-btn {
            font-size: 14px;
            color: rgb(117, 117, 117);
            text-transform: capitalize;
            position: absolute;
            bottom: 20px;
            right: 20px;
            cursor: pointer;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            cursor: pointer;
            color: #333;
        }
        @media screen and (max-width: 750px) {
            .container-form {
                width: 350px;
            }
            .bg {
                display: none;
            }
            form {
                width: 100%;
            }
        }
    </style>
</head>
<body>
  <section class="form-start">
    <div class="container-form" id="form-container">
        <div class="bg"></div>
        <form action="">
            <span class="close-btn" onclick="closeForm()">&times;</span>
            <h2 class="heading">Login Here</h2>
            <label for="email">Email: </label>
            <input type="email">
            <label for="password">Password: </label>
            <input type="password">
            <button class="login-btn" type="submit">Login</button>
            <span class="register-btn">Don't have an account?</span>
        </form>
    </div>
  </section>

  <script>
    function closeForm() {
        document.getElementById('form-container').style.display = 'none';
    }
  </script>
</body>
</html>
